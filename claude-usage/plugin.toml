id = "seo/claude-usage"
name = "Claude Usage"
version = "1.3.0"
plugin_api = 43
author = "Seo1323"
license = "MIT"
icon = "brain"
description = "Claude Code usage in the bar: 5-hour / weekly limit, time to reset and tokens used, as text, a bar or a ring."
tags = ["bar", "ai", "indicator", "utility"]
dependencies = ["curl", "jq"]

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default = 5
min = 1
max = 120

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "window"
  type = "select"
  label_key = "settings.window.label"
  description_key = "settings.window.description"
  default = "five_hour"
  options = [
    { value = "five_hour", label_key = "settings.window.five_hour" },
    { value = "weekly", label_key = "settings.window.weekly" },
    { value = "both", label_key = "settings.window.both" },
  ]

  [[widget.setting]]
  key = "display_mode"
  type = "select"
  label_key = "settings.display_mode.label"
  description_key = "settings.display_mode.description"
  default = "always"
  options = [
    { value = "always", label_key = "settings.display_mode.always" },
    { value = "important", label_key = "settings.display_mode.important" },
    { value = "hover", label_key = "settings.display_mode.hover" },
  ]

  [[widget.setting]]
  key = "logo"
  type = "select"
  label_key = "settings.logo.label"
  description_key = "settings.logo.description"
  default = "none"
  options = [
    { value = "none", label_key = "settings.logo.none" },
    { value = "glyph", label_key = "settings.logo.glyph" },
    { value = "star", label_key = "settings.logo.star" },
    { value = "custom", label_key = "settings.logo.custom" },
    { value = "ring", label_key = "settings.logo.ring" },
  ]

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "brain"
  visible_when = { key = "logo", values = ["glyph"] }

  [[widget.setting]]
  key = "logo_path"
  type = "file"
  label_key = "settings.logo_path.label"
  description_key = "settings.logo_path.description"
  default = ""
  extensions = [".svg", ".png"]
  visible_when = { key = "logo", values = ["custom"] }

  [[widget.setting]]
  key = "icon_size"
  type = "int"
  label_key = "settings.icon_size.label"
  default = 18
  min = 10
  max = 40

  [[widget.setting]]
  key = "show_percent"
  type = "bool"
  label_key = "settings.show_percent.label"
  default = true

  [[widget.setting]]
  key = "percent_mode"
  type = "select"
  label_key = "settings.percent_mode.label"
  default = "used"
  options = [
    { value = "used", label_key = "settings.percent_mode.used" },
    { value = "left", label_key = "settings.percent_mode.left" },
  ]
  visible_when = { key = "show_percent", values = ["true"] }

  [[widget.setting]]
  key = "show_prefix"
  type = "bool"
  label_key = "settings.show_prefix.label"
  description_key = "settings.show_prefix.description"
  default = false

  [[widget.setting]]
  key = "show_bar"
  type = "bool"
  label_key = "settings.show_bar.label"
  description_key = "settings.show_bar.description"
  default = false

  [[widget.setting]]
  key = "bar_width"
  type = "int"
  label_key = "settings.bar_width.label"
  default = 32
  min = 12
  max = 120
  visible_when = { key = "show_bar", values = ["true"] }

  [[widget.setting]]
  key = "gauge_mode"
  type = "select"
  label_key = "settings.gauge_mode.label"
  description_key = "settings.gauge_mode.description"
  default = "left"
  options = [
    { value = "left", label_key = "settings.gauge_mode.left" },
    { value = "used", label_key = "settings.gauge_mode.used" },
  ]

  [[widget.setting]]
  key = "show_reset"
  type = "bool"
  label_key = "settings.show_reset.label"
  description_key = "settings.show_reset.description"
  default = true

  [[widget.setting]]
  key = "reset_format"
  type = "select"
  label_key = "settings.reset_format.label"
  default = "compact"
  options = [
    { value = "compact", label_key = "settings.reset_format.compact" },
    { value = "verbose", label_key = "settings.reset_format.verbose" },
  ]
  visible_when = { key = "show_reset", values = ["true"] }

  [[widget.setting]]
  key = "ready_text"
  type = "string"
  label_key = "settings.ready_text.label"
  description_key = "settings.ready_text.description"
  default = "ready"
  visible_when = { key = "show_reset", values = ["true"] }

  [[widget.setting]]
  key = "show_tokens"
  type = "bool"
  label_key = "settings.show_tokens.label"
  description_key = "settings.show_tokens.description"
  default = true

  [[widget.setting]]
  key = "include_cache_read"
  type = "bool"
  label_key = "settings.include_cache_read.label"
  description_key = "settings.include_cache_read.description"
  default = false
  visible_when = { key = "show_tokens", values = ["true"] }

  [[widget.setting]]
  key = "token_format"
  type = "select"
  label_key = "settings.token_format.label"
  default = "short"
  options = [
    { value = "short", label_key = "settings.token_format.short" },
    { value = "full", label_key = "settings.token_format.full" },
  ]
  visible_when = { key = "show_tokens", values = ["true"] }

  [[widget.setting]]
  key = "separator"
  type = "select"
  label_key = "settings.separator.label"
  default = "none"
  options = [
    { value = "none", label_key = "settings.separator.none" },
    { value = "dot", label_key = "settings.separator.dot" },
    { value = "bar", label_key = "settings.separator.bar" },
    { value = "slash", label_key = "settings.separator.slash" },
  ]

  [[widget.setting]]
  key = "dim_extras"
  type = "bool"
  label_key = "settings.dim_extras.label"
  description_key = "settings.dim_extras.description"
  default = false

  [[widget.setting]]
  key = "gap"
  type = "int"
  label_key = "settings.gap.label"
  default = 4
  min = 0
  max = 24

  [[widget.setting]]
  key = "font_weight"
  type = "select"
  label_key = "settings.font_weight.label"
  default = "medium"
  options = [
    { value = "medium", label_key = "settings.font_weight.medium" },
    { value = "bold", label_key = "settings.font_weight.bold" },
  ]

  [[widget.setting]]
  key = "color_by_usage"
  type = "bool"
  label_key = "settings.color_by_usage.label"
  description_key = "settings.color_by_usage.description"
  default = true

  [[widget.setting]]
  key = "warn_at"
  type = "int"
  label_key = "settings.warn_at.label"
  default = 70
  min = 1
  max = 100
  visible_when = { key = "color_by_usage", values = ["true"] }

  [[widget.setting]]
  key = "critical_at"
  type = "int"
  label_key = "settings.critical_at.label"
  default = 90
  min = 1
  max = 100
  visible_when = { key = "color_by_usage", values = ["true"] }

  [[widget.setting]]
  key = "color"
  type = "color"
  label_key = "settings.color.label"
  description_key = "settings.color.description"
  default = "on_surface"
  advanced = true

  [[widget.setting]]
  key = "warn_color"
  type = "color"
  label_key = "settings.warn_color.label"
  default = "tertiary"
  visible_when = { key = "color_by_usage", values = ["true"] }
  advanced = true

  [[widget.setting]]
  key = "critical_color"
  type = "color"
  label_key = "settings.critical_color.label"
  default = "error"
  visible_when = { key = "color_by_usage", values = ["true"] }
  advanced = true

  [[widget.setting]]
  key = "click_command"
  type = "string"
  label_key = "settings.click_command.label"
  description_key = "settings.click_command.description"
  default = ""
  advanced = true

# Compact variant: only an icon or a usage ring, usage in the tooltip.
[[widget]]
id = "icon"
entry = "icon.luau"

  [[widget.setting]]
  key = "logo"
  type = "select"
  label_key = "settings.logo.label"
  description_key = "settings.logo.description"
  default = "glyph"
  options = [
    { value = "glyph", label_key = "settings.logo.glyph" },
    { value = "star", label_key = "settings.logo.star" },
    { value = "custom", label_key = "settings.logo.custom" },
    { value = "ring", label_key = "settings.logo.ring" },
  ]

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "brain"
  visible_when = { key = "logo", values = ["glyph"] }

  [[widget.setting]]
  key = "logo_path"
  type = "file"
  label_key = "settings.logo_path.label"
  description_key = "settings.logo_path.description"
  default = ""
  extensions = [".svg", ".png"]
  visible_when = { key = "logo", values = ["custom"] }

  [[widget.setting]]
  key = "size"
  type = "int"
  label_key = "settings.size.label"
  default = 20
  min = 10
  max = 40

  [[widget.setting]]
  key = "command"
  type = "string"
  label_key = "settings.command.label"
  description_key = "settings.command.description"
  default = "alacritty -e claude"
