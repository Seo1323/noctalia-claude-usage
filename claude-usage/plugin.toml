id = "seo/claude-usage"
name = "Claude Limits"
version = "1.12.0"
plugin_api = 43
author = "Seo1323"
license = "MIT"
icon = "brain"
description = "Claude Code usage in the bar: 5-hour / weekly limit, time to reset and tokens used, as text, a bar or a ring."
tags = ["bar", "ai", "indicator", "utility"]
dependencies = ["curl", "jq"]

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default = 5
min = 1
max = 120

[[setting]]
key = "percent_decimals"
type = "int"
label_key = "settings.percent_decimals.label"
description_key = "settings.percent_decimals.description"
default = 0
min = 0
max = 2
advanced = true

[[setting]]
key = "launch_command"
type = "string"
label_key = "settings.launch_command.label"
description_key = "settings.launch_command.description"
default = "alacritty -e claude"

[[setting]]
key = "count_cache_writes"
type = "bool"
label_key = "settings.count_cache_writes.label"
description_key = "settings.count_cache_writes.description"
default = false

[[setting]]
key = "show_prices"
type = "bool"
label_key = "settings.show_prices.label"
description_key = "settings.show_prices.description"
default = true

[[setting]]
key = "currency"
type = "select"
label_key = "settings.currency.label"
description_key = "settings.currency.description"
default = "USD"
options = [
  { value = "USD", label_key = "settings.currency.USD" },
  { value = "EUR", label_key = "settings.currency.EUR" },
  { value = "PLN", label_key = "settings.currency.PLN" },
  { value = "GBP", label_key = "settings.currency.GBP" },
  { value = "CHF", label_key = "settings.currency.CHF" },
  { value = "JPY", label_key = "settings.currency.JPY" },
  { value = "CNY", label_key = "settings.currency.CNY" },
  { value = "CAD", label_key = "settings.currency.CAD" },
  { value = "AUD", label_key = "settings.currency.AUD" },
  { value = "SEK", label_key = "settings.currency.SEK" },
  { value = "NOK", label_key = "settings.currency.NOK" },
  { value = "DKK", label_key = "settings.currency.DKK" },
  { value = "CZK", label_key = "settings.currency.CZK" },
  { value = "HUF", label_key = "settings.currency.HUF" },
  { value = "RON", label_key = "settings.currency.RON" },
  { value = "TRY", label_key = "settings.currency.TRY" },
  { value = "BRL", label_key = "settings.currency.BRL" },
  { value = "INR", label_key = "settings.currency.INR" },
  { value = "KRW", label_key = "settings.currency.KRW" },
  { value = "MXN", label_key = "settings.currency.MXN" },
]

[[setting]]
key = "exchange_rate"
type = "double"
label_key = "settings.exchange_rate.label"
description_key = "settings.exchange_rate.description"
default = 0.0
min = 0.0
max = 2000.0
step = 0.01
advanced = true

[[setting]]
key = "custom_prices"
type = "bool"
label_key = "settings.custom_prices.label"
description_key = "settings.custom_prices.description"
default = false
advanced = true

[[setting]]
key = "price_input"
type = "double"
label_key = "settings.price_input.label"
description_key = "settings.price_input.description"
default = 4.0
min = 0.0
max = 200.0
step = 0.05
visible_when = { key = "custom_prices", values = ["true"] }

[[setting]]
key = "price_output"
type = "double"
label_key = "settings.price_output.label"
description_key = "settings.price_output.description"
default = 20.0
min = 0.0
max = 500.0
step = 0.05
visible_when = { key = "custom_prices", values = ["true"] }

[[setting]]
key = "price_cache_read"
type = "double"
label_key = "settings.price_cache_read.label"
description_key = "settings.price_cache_read.description"
default = 0.2
min = 0.0
max = 50.0
step = 0.01
visible_when = { key = "custom_prices", values = ["true"] }

[[service]]
id = "poller"
entry = "service.luau"

# Opened by a left click on the bar widget: launch Claude Code, graphs, tokens per model.
# Centered like the built-in panels; placement / position / open-near-click can be changed in
# Settings -> Plugins (Noctalia adds these standard panel settings itself).
[[panel]]
id = "panel"
entry = "panel.luau"
width = 380
height = "content"
max_height = 980
placement = "floating"
position = "center"
open_near_click = false

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "match_ui"
  type = "bool"
  label_key = "settings.match_ui.label"
  description_key = "settings.match_ui.description"
  default = true

  [[widget.setting]]
  key = "window"
  type = "select"
  label_key = "settings.window.label"
  description_key = "settings.window.description"
  default = "five_hour"
  options = [
    { value = "five_hour", label_key = "settings.window.five_hour" },
    { value = "weekly", label_key = "settings.window.weekly" },
    { value = "both", label_key = "settings.window.both" },
  ]

  [[widget.setting]]
  key = "display_mode"
  type = "select"
  label_key = "settings.display_mode.label"
  description_key = "settings.display_mode.description"
  default = "always"
  options = [
    { value = "always", label_key = "settings.display_mode.always" },
    { value = "important", label_key = "settings.display_mode.important" },
    { value = "hover", label_key = "settings.display_mode.hover" },
  ]

  [[widget.setting]]
  key = "animation_ms"
  type = "int"
  label_key = "settings.animation_ms.label"
  description_key = "settings.animation_ms.description"
  default = 250
  min = 0
  max = 1000
  step = 50
  visible_when = { key = "display_mode", values = ["hover"] }

  [[widget.setting]]
  key = "logo"
  type = "select"
  label_key = "settings.logo.label"
  description_key = "settings.logo.description"
  default = "ring"
  options = [
    { value = "none", label_key = "settings.logo.none" },
    { value = "glyph", label_key = "settings.logo.glyph" },
    { value = "star", label_key = "settings.logo.star" },
    { value = "custom", label_key = "settings.logo.custom" },
    { value = "ring", label_key = "settings.logo.ring" },
  ]

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "brain"
  visible_when = { key = "logo", values = ["glyph"] }

  [[widget.setting]]
  key = "logo_path"
  type = "file"
  label_key = "settings.logo_path.label"
  description_key = "settings.logo_path.description"
  default = ""
  extensions = [".svg", ".png"]
  visible_when = { key = "logo", values = ["custom"] }

  [[widget.setting]]
  key = "icon_size"
  type = "int"
  label_key = "settings.icon_size.label"
  default = 18
  min = 10
  max = 40

  [[widget.setting]]
  key = "ring_thickness"
  type = "select"
  label_key = "settings.ring_thickness.label"
  default = "normal"
  options = [
    { value = "thin", label_key = "settings.ring_thickness.thin" },
    { value = "normal", label_key = "settings.ring_thickness.normal" },
    { value = "thick", label_key = "settings.ring_thickness.thick" },
  ]
  visible_when = { key = "logo", values = ["ring"] }

  [[widget.setting]]
  key = "ring_track"
  type = "bool"
  label_key = "settings.ring_track.label"
  description_key = "settings.ring_track.description"
  default = true
  visible_when = { key = "logo", values = ["ring"] }
  advanced = true

  [[widget.setting]]
  key = "format"
  type = "string"
  label_key = "settings.format.label"
  description_key = "settings.format.description"
  default = ""
  advanced = true

  [[widget.setting]]
  key = "limit_countdown"
  type = "bool"
  label_key = "settings.limit_countdown.label"
  description_key = "settings.limit_countdown.description"
  default = true

  [[widget.setting]]
  key = "show_percent"
  type = "bool"
  label_key = "settings.show_percent.label"
  default = true

  [[widget.setting]]
  key = "percent_mode"
  type = "select"
  label_key = "settings.percent_mode.label"
  default = "used"
  options = [
    { value = "used", label_key = "settings.percent_mode.used" },
    { value = "left", label_key = "settings.percent_mode.left" },
  ]
  visible_when = { key = "show_percent", values = ["true"] }

  [[widget.setting]]
  key = "show_prefix"
  type = "bool"
  label_key = "settings.show_prefix.label"
  description_key = "settings.show_prefix.description"
  default = false

  [[widget.setting]]
  key = "label_five"
  type = "string"
  label_key = "settings.label_five.label"
  default = "5h"
  visible_when = { key = "show_prefix", values = ["true"] }
  advanced = true

  [[widget.setting]]
  key = "label_week"
  type = "string"
  label_key = "settings.label_week.label"
  default = "7d"
  visible_when = { key = "show_prefix", values = ["true"] }
  advanced = true

  [[widget.setting]]
  key = "show_bar"
  type = "bool"
  label_key = "settings.show_bar.label"
  description_key = "settings.show_bar.description"
  default = false

  [[widget.setting]]
  key = "bar_width"
  type = "int"
  label_key = "settings.bar_width.label"
  default = 32
  min = 12
  max = 120
  visible_when = { key = "show_bar", values = ["true"] }
  advanced = true

  [[widget.setting]]
  key = "gauge_mode"
  type = "select"
  label_key = "settings.gauge_mode.label"
  description_key = "settings.gauge_mode.description"
  default = "left"
  options = [
    { value = "left", label_key = "settings.gauge_mode.left" },
    { value = "used", label_key = "settings.gauge_mode.used" },
