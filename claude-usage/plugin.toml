  [[widget.setting]]
  key = "dim_extras"
  type = "bool"
  label_key = "settings.dim_extras.label"
  description_key = "settings.dim_extras.description"
  default = true

  [[widget.setting]]
  key = "font_size"
  type = "int"
  label_key = "settings.font_size.label"
  description_key = "settings.font_size.description"
  default = 0
  min = 0
  max = 32
  advanced = true

  [[widget.setting]]
  key = "gap"
  type = "int"
  label_key = "settings.gap.label"
  default = 4
  min = 0
  max = 24
  advanced = true

  [[widget.setting]]
  key = "font_weight"
  type = "select"
  label_key = "settings.font_weight.label"
